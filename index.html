<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Todo V2.0</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; }
    #list { list-style: none; padding: 0; }
    #list li { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; }
    #list li.done .text { text-decoration: line-through; color: #aaa; }
    #list li .text { flex: 1; cursor: pointer; }
    #list li .del { border: none; background: transparent; color: #e74c3c; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Todo V2.0</h1>
  <div>
    <input id="new-todo" type="text" placeholder="输入任务" />
    <button id="add-btn">添加</button>
  </div>
  <ul id="list"></ul>

  <script>
    let todos = [];

    function addTodo(text) {
      if (!text.trim()) return;
      todos = [...todos, { id: Date.now(), text: text.trim(), done: false }];
      render();
    }
    function removeTodo(id) {
      todos = todos.filter(t => t.id !== id);
      render();
    }
    function toggleTodo(id) {
      todos = todos.map(t => t.id === id ? { ...t, done: !t.done } : t);
      render();
    }

    function render() {
      const list = document.querySelector('#list');
      list.innerHTML = '';
      if (todos.length === 0) {
        const li = document.createElement('li');
        li.textContent = '暂无任务';
        list.appendChild(li);
        return;
      }
      todos.forEach(todo => {
        const li = document.createElement('li');
        if (todo.done) li.classList.add('done');
        const span = document.createElement('span');
        span.className = 'text';
        span.textContent = todo.text;
        span.addEventListener('click', () => toggleTodo(todo.id));
        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '×';
        del.addEventListener('click', () => removeTodo(todo.id));
        li.appendChild(span);
        li.appendChild(del);
        list.appendChild(li);
      });
    }

    document.querySelector('#add-btn').addEventListener('click', () => {
      const input = document.querySelector('#new-todo');
      addTodo(input.value);
      input.value = '';
    });
    document.querySelector('#new-todo').addEventListener('keydown', e => {
      if (e.key === 'Enter') { addTodo(e.target.value); e.target.value = ''; }
    });

    render();
  </script>
</body>
</html>
