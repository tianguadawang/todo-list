<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Todo V2.0 - W8 修复版</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    #list { list-style: none; padding: 0; }
    #list li { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
    #list li.done .text { text-decoration: line-through; color: #aaa; }
    #list li .text { flex: 1; cursor: pointer; }
    #list li .del { border: none; background: transparent; color: #e74c3c; cursor: pointer; font-size: 16px; }
    .filters { display: flex; gap: 8px; margin: 12px 0; }
    .filters button { flex: 1; padding: 6px; border: 1px solid #ddd; background: #fff; border-radius: 6px; cursor: pointer; }
    .filters button.active { background: #4a90e2; color: #fff; border-color: #4a90e2; }
    .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; color: #666; }
    #clear-completed { border: none; background: transparent; color: #e74c3c; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Todo V2.0</h1>

  <div>
    <input id="new-todo" type="text" placeholder="输入任务" />
    <button id="add-btn">添加</button>
  </div>

  <div class="filters">
    <button data-filter="all" class="active">全部</button>
    <button data-filter="active">未完成</button>
    <button data-filter="completed">已完成</button>
  </div>

  <ul id="list"></ul>

  <div class="footer">
    <span id="count">0 项未完成</span>
    <button id="clear-completed">清除已完成</button>
  </div>

  <script>
    let todos = [];
    let filter = 'all';

    function save() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function load() {
      try {
        const raw = localStorage.getItem('todos');
        todos = raw ? JSON.parse(raw) : [];
      } catch (e) {
        todos = [];
        console.warn('localStorage 数据损坏，已重置');
      }
    }

    function addTodo(text) {
      if (!text.trim()) return;
      todos = [...todos, { id: Date.now(), text: text.trim(), done: false }];
      save();
      render();
    }

    function removeTodo(id) {
      console.log('removeTodo:', id);
      todos = todos.filter(t => String(t.id) !== String(id));
      save();
      render();
    }

    function toggleTodo(id) {
      console.log('toggleTodo:', id);
      todos = todos.map(t =>
        String(t.id) === String(id) ? { ...t, done: !t.done } : t
      );
      save();
      render();
    }

    function clearCompleted() {
      todos = todos.filter(t => !t.done);
      save();
      render();
    }

    function render() {
      const list = document.querySelector('#list');
      list.innerHTML = '';

      const visibleTodos = todos.filter(todo => {
        if (filter === 'active') return !todo.done;
        if (filter === 'completed') return todo.done;
        return true;
      });

      if (visibleTodos.length === 0) {
        const li = document.createElement('li');
        li.textContent = '暂无任务';
        list.appendChild(li);
      } else {
        visibleTodos.forEach(todo => {
          const li = document.createElement('li');
          li.dataset.id = todo.id;
          if (todo.done) li.classList.add('done');

          const span = document.createElement('span');
          span.className = 'text';
          span.dataset.action = 'toggle';
          span.textContent = todo.text;

          const del = document.createElement('button');
          del.className = 'del';
          del.dataset.action = 'delete';
          del.textContent = '×';

          li.appendChild(span);
          li.appendChild(del);
          list.appendChild(li);
        });
      }

      const activeCount = todos.filter(t => !t.done).length;
      document.querySelector('#count').textContent = `${activeCount} 项未完成`;

      document.querySelectorAll('.filters button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
    }

    /* ===== 修复版事件委托 ===== */
    const list = document.querySelector('#list');
    list.addEventListener('click', (e) => {
      if (!(e.target instanceof Element)) return;
      const item = e.target.closest('li');
      if (!item || !list.contains(item)) return;
      const id = item.dataset.id;
      if (!id) return;

      if (e.target.closest('[data-action="delete"]')) {
        removeTodo(id);
      } else if (e.target.closest('[data-action="toggle"]')) {
        toggleTodo(id);
      }
    });

    document.querySelector('#add-btn').addEventListener('click', () => {
      const input = document.querySelector('#new-todo');
      addTodo(input.value);
      input.value = '';
    });

    document.querySelector('#new-todo').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        addTodo(e.target.value);
        e.target.value = '';
      }
    });

    document.querySelectorAll('.filters button').forEach(btn => {
      btn.addEventListener('click', () => {
        filter = btn.dataset.filter;
        render();
      });
    });

    document.querySelector('#clear-completed').addEventListener('click', clearCompleted);

    load();
    render();
  </script>
</body>
</html>
